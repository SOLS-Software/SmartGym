packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@prisma/client': false
  '@prisma/engines': false
  esbuild: false
  prisma: false
  sharp: false
# Overrides de segurança. Moradia correta desde o pnpm 10: o campo `pnpm.overrides`
# do package.json raiz e IGNORADO pelo pnpm atual (ele avisa no install), e os pins
# so sobreviviam gravados no lockfile — sumiriam na proxima regeneracao. Aqui eles
# valem de novo. Versoes conferidas contra `pnpm audit` em 2026-09-09: fast-uri,
# brace-expansion, js-yaml, sharp e undici foram apertados para as faixas ja
# corrigidas (os ranges anteriores ainda resolviam versoes vulneraveis).
overrides:
  shell-quote: '>=1.8.4'
  tar: '>=7.5.19 <8.0.0'
  js-yaml@3: '>=3.15.2 <4.0.0'
  js-yaml@4: '>=4.3.2 <5.0.0'
  brace-expansion@1: '>=1.1.18 <2.0.0'
  brace-expansion@2: '>=2.1.4 <3.0.0'
  brace-expansion@5: '>=5.0.9 <6.0.0'
  ws@6: '>=6.2.4 <7.0.0'
  ws@7: '>=7.5.11 <8.0.0'
  ws@8: '>=8.21.0 <9.0.0'
  undici: '>=6.28.0 <7.0.0'
  fast-uri: '>=3.1.6 <4.0.0'
  postcss: '>=8.5.18 <9.0.0'
  find-my-way: '>=9.7.0 <10.0.0'
  uuid@3: '>=3.4.0 <4.0.0'
  uuid@11: '>=11.1.1 <12.0.0'
  '@babel/core': '>=7.29.6 <8.0.0'
  esbuild: '>=0.28.1 <0.29.0'
  sharp: '>=0.35.4 <0.36.0'
  # Transitivas do toolchain de build do Expo SDK 54 (build-time, nao runtime do
  # app). Patch na mesma major — conferido em 2026-09-10 contra `pnpm audit`.
  # NAO cobertos aqui de proposito: `uuid@7` (do @expo/config-plugins; so corrige
  # em 11.x, salto de 4 majors que quebraria o Expo) e `image-size` (sem versao
  # corrigida upstream). Ambos esperam o Expo atualizar.
  browserslist: '>=4.28.7 <5.0.0'
  baseline-browser-mapping: '>=2.11.0 <3.0.0'
  nanoid@3: '>=3.3.18 <4.0.0'
  '@xmldom/xmldom': '>=0.9.12 <0.10.0'
  decode-uri-component: '>=0.5.0 <0.6.0'

# Ignore-list do `pnpm audit` (CI). Sao as vulnerabilidades SEM correcao viavel
# hoje — presas a upstream (Expo/Prisma) ou sem patch. O CI roda audit com
# --audit-level=high; assim ele falha em qualquer vuln NOVA, mas nao trava
# eternamente nestas. Revisar quando o upstream lancar fix (ver relatorio A-3).
auditConfig:
  ignoreGhsas:
    - GHSA-w5hq-g745-h8pq  # uuid@7 — @expo/config-plugins (SDK 54); so corrige em 11.x
    - GHSA-w3rx-r6r6-pgpr  # image-size — sem versao corrigida upstream
    - GHSA-5p2g-fcmc-qvqq  # image-size — idem
    - GHSA-ggr8-5vv4-36mx  # deepmerge-ts (db) — patch so em 8.x, major transitiva
